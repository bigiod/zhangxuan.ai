<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传系统</title>
    <style>
        /* CSS样式直接内联在HTML中 */
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --light-gray: #f8f9fa;
            --border-color: #e1e5e9;
            --text-dark: #333;
            --text-light: #666;
            --success-bg: #e6f9f0;
            --success-text: #28a745;
            --error-bg: #fdeeee;
            --error-text: #dc3545;
            --danger-color: #e53e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: height 0.4s ease-in-out;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            color: var(--text-light);
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--light-gray);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .upload-area {
            border: 3px dashed var(--border-color);
            border-radius: 15px;
            padding: 40px 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fdfdff;
        }

        .upload-area:hover, .upload-area.dragover {
            background: #f0f4ff;
            border-color: var(--primary-color);
        }

        .upload-area.dragover {
            transform: scale(1.02);
        }

        /* 新增：上传区域禁用状态 */
        .upload-area.disabled {
            cursor: not-allowed;
            background-color: #f5f5f5;
            border-color: #e0e0e0;
            opacity: 0.7;
        }
        .upload-area.disabled .upload-icon,
        .upload-area.disabled .upload-text,
        .upload-area.disabled .upload-hint {
            color: #9e9e9e;
        }


        .upload-icon {
            font-size: 3em;
            color: var(--primary-color);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        .upload-area:hover .upload-icon {
            transform: scale(1.1);
        }

        .upload-text {
            font-size: 1.2em;
            color: var(--text-dark);
            font-weight: 600;
        }

        .upload-hint {
            color: var(--text-light);
            font-size: 0.9em;
            margin-top: 5px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            background: var(--border-color);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 0.9em;
            color: var(--text-light);
            margin-top: 8px;
            font-weight: 500;
        }
        
        .message-box {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid transparent;
            font-weight: 500;
        }
        .message-box.error {
            background: var(--error-bg);
            color: var(--error-text);
            border-color: var(--error-text);
        }
        .message-box.success {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-text);
        }

        .hidden {
            display: none !important;
        }
        
        /* 修改：#fileListContainer 作为列表容器 */
        #fileListContainer {
            margin-top: 20px;
            text-align: left;
        }

        /* 新增：文件列表项样式 */
        .file-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--light-gray);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .file-details {
            flex-grow: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .file-name {
            font-weight: 600;
            color: var(--text-dark);
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-size {
            color: var(--text-light);
            font-size: 0.9em;
        }

        /* 新增：删除按钮样式 */
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger-color);
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            margin-left: 15px;
            padding: 0 5px;
            line-height: 1;
            transition: transform 0.2s ease;
        }
        .delete-btn:hover {
            transform: scale(1.2);
        }

        /* 新增：结果列表样式 */
        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--success-bg);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--success-text);
            text-align: left;
        }
        .result-link {
            flex-grow: 1;
            color: var(--success-text);
            font-weight: 600;
            text-decoration: none;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            margin-right: 15px;
        }
        .result-link:hover {
            text-decoration: underline;
        }
        /* 新增：复制按钮样式，继承自.btn */
        .copy-btn {
            padding: 8px 15px; /* 尺寸更小 */
            font-size: 14px;
            width: auto; /* 宽度自适应 */
            margin-top: 0; /* 无需上边距 */
            flex-shrink: 0; /* 防止被压缩 */
        }


        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 540px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            .title { font-size: 2em; }
            .description { font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录界面 -->
        <div id="loginSection">
            <h1 class="title">用户登录</h1>
            <p class="description">真极AI工厂出品</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <div class="message-box error hidden" id="loginError"></div>
                <button type="submit" class="btn" id="loginBtn">
                    <span class="btn-text">登录</span>
                </button>
            </form>
        </div>

        <!-- 上传界面 -->
        <div id="uploadSection" class="hidden">
            <h1 class="title">上传文件</h1>
            <p class="description">将文件拖拽到下方区域，或点击选择</p>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">⬆️</div>
                <div class="upload-text">点击或拖拽文件到此处</div>
                <div class="upload-hint" id="uploadHint">最多支持10个文件</div>
            </div>
            
            <!-- 重要：添加 multiple 属性以支持多文件选择 -->
            <input type="file" id="fileInput" class="hidden" multiple>
            
            <!-- fileInfo 重命名为 fileListContainer 以反映其新用途 -->
            <div id="fileListContainer"></div>
            
            <div class="progress-container hidden" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>
            
            <div class="message-box error hidden" id="uploadError"></div>
            <!-- success message box 不再需要 -->
            <!-- <div class="message-box success hidden" id="uploadSuccess"></div> -->
            
            <button class="btn" id="uploadBtn" disabled>开始上传</button>
            <button class="btn hidden" id="resetBtn">上传更多文件</button>
        </div>
    </div>

    <!-- 使用 defer 属性确保脚本在HTML解析完毕后执行 -->
    <script src="script.js" defer></script>
</body>
</html>
