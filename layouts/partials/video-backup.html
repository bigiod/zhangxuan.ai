{{ with .Site.Params.featuredVideo }}
<!-- 引入独立的CSS文件 -->
{{ $videoCSS := resources.Get "css/video.css" | resources.Minify }}
<link rel="stylesheet" href="{{ $videoCSS.RelPermalink }}">

<div class="ai-video-container">
  {{ with .title }}
  <div class="ai-video-title">
    <h2>{{ . }}</h2>
    {{ with $.Site.Params.featuredVideo.description }}
    <p>{{ . }}</p>
    {{ end }}
  </div>
  {{ end }}
  
  <div class="ai-video-player" data-video-id="{{ .videoId }}" data-video-type="{{ .type }}" data-thumbnail="{{ .thumbnail }}">
    <img 
      src="{{ .thumbnail }}" 
      alt="{{ .title }}" 
      class="ai-video-thumbnail"
      loading="eager"
    >
    <div class="ai-video-play-button"></div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const videoPlayer = document.querySelector('.ai-video-player');
    const playButton = document.querySelector('.ai-video-play-button');
    
    if (playButton) {
      playButton.addEventListener('click', function(e) {
        e.preventDefault();
        
        const videoId = videoPlayer.getAttribute('data-video-id');
        const videoType = videoPlayer.getAttribute('data-video-type');
        
        // 根据视频类型创建播放器
        if (videoType === 'youtube') {
          const iframe = document.createElement('iframe');
          iframe.className = 'ai-video-iframe';
          iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0`;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
          iframe.allowFullscreen = true;
          
          videoPlayer.innerHTML = '';
          videoPlayer.appendChild(iframe);
        } else if (videoType === 'bilibili') {
          const iframe = document.createElement('iframe');
          iframe.className = 'ai-video-iframe';
          iframe.src = `https://player.bilibili.com/player.html?bvid=${videoId}&autoplay=1`;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
          iframe.allowFullscreen = true;
          
          videoPlayer.innerHTML = '';
          videoPlayer.appendChild(iframe);
        } else if (videoType === 'local') {
          const video = document.createElement('video');
          video.className = 'ai-video-player-element';
          video.src = videoId; // 本地视频路径
          video.controls = true;
          video.autoplay = true;
          
          videoPlayer.innerHTML = '';
          videoPlayer.appendChild(video);
        }
      });
    }
  });
</script>
{{ end }}
